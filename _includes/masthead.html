{% include base_path %}

<div class="masthead">
  <div class="masthead__inner-wrap">
    <div class="masthead__menu">
      <nav id="site-nav" class="greedy-nav">
        <button><div class="navicon"></div></button>
        <ul class="visible-links">
          <li class="masthead__menu-item masthead__menu-item--lg persist"><a href="{{ base_path }}/" class="masthead__logo" aria-label="Home"><span class="blue-square"></span></a></li>
          {% for link in site.data.navigation.main %}
            {% if link.url contains 'http' %}
              {% assign domain = '' %}
            {% else %}
              {% assign domain = base_path %}
            {% endif %}
            <li class="masthead__menu-item"><a href="{{ domain }}{{ link.url }}"{% if link.highlight %} class="masthead__highlight"{% endif %}>{{ link.title }}</a></li>
          {% endfor %}
        </ul>
        <ul class="hidden-links hidden"></ul>
        <div class="masthead__social-links">
          <a href="mailto:dani.cmh.lee@gmail.com">Email</a>
          <a href="https://scholar.google.com/citations?hl=en&user=9sXW7koAAAAJ" target="_blank">Scholar</a>
          <a href="https://x.com/Danicmhlee" target="_blank">X</a>
          <a href="https://github.com/danihyunlee" target="_blank">GitHub</a>
          <a href="https://www.linkedin.com/in/dan-l-92a06a135/" target="_blank">LinkedIn</a>
        </div>
      </nav>
    </div>
  </div>
</div>
